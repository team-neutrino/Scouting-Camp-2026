<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8" />
    <title>CSS Practice 4</title>
    <link rel="styleSheet" type="text/css" href="autonpage.css">
</head>

<body>
    <table>
        <tr>
            <th colspan="3">Auton</th>
        </tr>
        <tr>
            <th colspan="3">Fuel</th>
        </tr>
        <tr>
            <td colspan="1"> <button class="red">- 9</button></td>
            <td rowspan="3"><textarea id="console">Score Updates</textarea></td>
            <td colspan="1"> <button class="green">+ 9</button></td>
        </tr>
        <tr>
            <td colspan="1"> <button class="red">- 3</button></td>
            <td colspan="1"> <button class="green">+ 3</button></td>
        </tr>
        <tr>
            <td colspan="1"> <button class="red">- 1</button></td>
            <td colspan="1"> <button class="green">+ 1</button></td>
        </tr>
        <tr>
            <td class="climb" colspan="3"> Climb <input class="limb" type="checkbox"> </td>
        </tr>
        <tr>
            <td colspan="1"> <button class="arrows"> &leftarrow; </button></td>
            <td></td>
            <td colspan="1"> <button class="arrows"> &rightarrow; </button></td>
        </tr>

</body>

</html>
